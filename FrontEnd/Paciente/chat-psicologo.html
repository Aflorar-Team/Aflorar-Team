<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversas com psicólogos - Aflorar</title>
  <link rel="stylesheet" href="../shared/css/global.css">
  <link rel="stylesheet" href="../shared/css/private-chat.css">
</head>

<body class="private-chat-page" data-chat-role="paciente">
  <header class="navbar">
    <div class="logo">Aflorar</div>
    <nav class="menu" aria-label="Navegação principal">
      <a href="./inicio.html">🏠 Início</a>
      <a href="./chat-ia.html">💼 Flora</a>
      <a href="./chat-psicologo.html" class="active" aria-current="page">💬 Conversas</a>
      <a href="./jardim.html">🌿 Jardim</a>
      <a href="./diario.html">📔 Diário</a>
    </nav>
    <a href="./configuracoes.html" aria-label="Ir para configurações">
      <img class="foto-pacientes" src="https://randomuser.me/api/portraits/men/21.jpg" alt="">
    </a>
  </header>

  <main class="private-chat-main" id="privateChat" data-active="false">
    <aside class="chat-sidebar" aria-label="Lista de conversas">
      <div class="chat-sidebar-heading">
        <h1>Conversas</h1>
        <p>Psicólogos com vínculo aceito</p>
      </div>
      <div class="chat-search-wrap">
        <label class="sr-only" for="chatSearch">Buscar psicólogo</label>
        <input class="chat-search" id="chatSearch" type="search" placeholder="Buscar psicólogo">
      </div>
      <div class="chat-contact-list" id="chatContactList" aria-live="polite">
        <p class="chat-list-state">Carregando conversas...</p>
      </div>
    </aside>

    <section class="chat-conversation" aria-label="Conversa selecionada">
      <header class="chat-conversation-heading">
        <button class="chat-back" id="chatBack" type="button" aria-label="Voltar para a lista">‹</button>
        <div class="chat-conversation-identity" id="chatConversationIdentity">
          <div class="chat-conversation-copy">
            <h2 id="chatConversationName">Suas conversas</h2>
            <p id="chatConversationStatus">Selecione um psicólogo na lateral</p>
          </div>
        </div>
      </header>
      <div class="chat-messages" id="chatMessages" aria-live="polite" aria-relevant="additions text"></div>
      <p class="chat-status" id="chatStatus" role="status"></p>
      <form class="chat-compose" id="chatCompose">
        <label class="sr-only" for="chatMessageInput">Escreva sua mensagem</label>
        <textarea id="chatMessageInput" name="conteudo" maxlength="2000" rows="1" placeholder="Escreva uma mensagem..." disabled required></textarea>
        <button id="chatSend" type="submit" aria-label="Enviar mensagem" disabled>➤</button>
      </form>
    </section>
  </main>
  <script src="../shared/js/private-chat.js"></script>
</body>

</html>
