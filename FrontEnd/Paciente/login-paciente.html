<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Aflorar</title>
  <script src="../shared/js/theme.js"></script>
  <link rel="stylesheet" href="../shared/css/login.css">
  <link rel="stylesheet" href="../shared/css/global.css">
  <link rel="stylesheet" href="../shared/css/theme.css">
</head>

<body>

  <div class="background" aria-hidden="true">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>

  <header class="topbar">
    <div class="logo-wrap">
      <h1 class="logo">Aflorar</h1>
    </div>

    <nav class="top-nav" aria-label="Navegação principal">
      <a href="../index.html#sobre">Sobre</a>
      <a href="../index.html#contato">Contato</a>
    </nav>
  </header>

  <main class="auth-page">
    <div class="login-card">
      <h2>Bem-vindo(a) de volta</h2>

      <!-- ✅ Adicionado id no form e ids nos inputs -->
      <form id="formLogin">
        <label>E-mail</label>
        <div class="input-group">
          <input type="email" id="email" placeholder="exemplo@email.com">
        </div>

        <label>Senha</label>
        <div class="input-group">
          <input type="password" id="password" placeholder="Sua senha" minlength="6" maxlength="20"
            autocomplete="current-password">
          <button type="button" id="togglePassword"></button>
        </div>

        <a href="#" class="forgot">Esqueceu a senha?</a>

        <!-- ✅ Virou button para o JS capturar -->
        <button type="submit" class="btn-primary">Entrar</button>

        <!-- ✅ Mensagem de erro -->
        <p id="mensagemErro" style="color:red; display:none;"></p>

        <div class="divider">ou</div>

        <button type="button" class="btn-google" data-google-auth="paciente">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" />
          Entrar com o Google
        </button>

        <p class="register">
          Ainda não tem uma conta? <a href="./cadastro-paciente.html">Registre-se</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="page-footer">
    © 2025 Aflorar. Todos os direitos reservados.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/js/auth-session.js"></script>
  <script src="../shared/js/password-recovery.js"></script>
  <script src="./js/login-paciente.js"></script>
</body>

</html>
