<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gráficos do Paciente - Aflorar</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="stylesheet" href="./css/graficos.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">✿ Aflorar</div>
    <nav class="menu">
      <a href="./dashboard-psicologo.html">
        <span class="icon">🏠</span> Início
      </a>
      <a href="./chat-psicologo.html">
        <span class="icon">💬</span> Mensagens
      </a>
      <a href="./agenda-psicologo.html">
        <span class="icon">📅</span> Agenda
      </a>
      <a href="./anotacoes-compartilhadas.html">
        <span class="icon">🌿</span> Compartilhadas
      </a>
    </nav>
    <div style="width:40px"></div>
  </header>

  <main>
    <div class="topo">
      <div class="titulo-card">Analise os gráficos!</div>
      <div class="filtros">
        <button class="btn-filtro mensal ativo" onclick="trocarFiltro('mensal', this)">Mensal</button>
        <button class="btn-filtro semanal" onclick="trocarFiltro('semanal', this)">Semanal</button>
        <button class="btn-filtro diario" onclick="trocarFiltro('diario', this)">Diário</button>
      </div>
    </div>

    <label class="selecao-paciente" for="pacienteSelect">
      Paciente
      <select id="pacienteSelect" aria-describedby="statusGrafico"></select>
    </label>
    <p id="statusGrafico" class="status-grafico" role="status">Carregando registros...</p>

    <div class="card-grafico">
      <h2 id="tituloGrafico">Registros de humor</h2>

      <div class="grafico-layout">
        <div class="canvas-wrapper">
          <canvas id="graficoHumor"></canvas>
        </div>

        <div class="legenda" id="legenda"></div>
      </div>
    </div>
  </main>

  <footer>© 2025 Aflorar. Todos os direitos reservados.</footer>

  <script src="./js/graficos.js"></script>
</body>

</html>
