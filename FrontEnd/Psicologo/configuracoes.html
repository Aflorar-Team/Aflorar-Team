<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações - Aflorar</title>
  <script src="../shared/js/theme.js"></script>
  <link rel="stylesheet" href="../shared/css/config.css" />
  <link rel="stylesheet" href="../shared/css/theme.css" />
</head>

<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-acoes">
      <button class="nav-btn" onclick="alert('Nenhuma notificação no momento.')">
        <span class="icone">🔔</span>
        Notificação
      </button>
      <button class="nav-btn" id="btnModoEscuro" onclick="alternarModo()">
        <span class="icone">🌙</span>
        <span class="nav-label">Modo escuro</span>
      </button>
      <a class="nav-btn" href="./anotacoes-compartilhadas.html">
        <span class="icone">🌿</span>
        Compartilhadas
      </a>
      <button class="nav-btn" onclick="sair()">
        <span class="icone">🚪</span>
        Sair da conta
      </button>
    </div>
  </header>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-left">
      <div class="hero-logo">✿ Aflorar</div>
    </div>
    <div class="hero-center"></div>
    <div class="hero-right">
      <!-- Adicione os ícones aqui -->
    </div>
  </div>

  <!-- FORMULÁRIO -->
  <div class="form-container">
    <div class="form-grid">
      <div class="campo">
        <label>Nome</label>
        <input type="text" id="nome" placeholder="Seu nome completo" />
      </div>

      <div class="campo">
        <label>CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" />
      </div>

      <div class="campo">
        <label>CRP</label>
        <input type="text" id="crp" placeholder="000.000.000-00" />
      </div>

      <div class="campo">
        <label for="senha">Nova senha (opcional)</label>
        <div class="input-icon">
          <span>✉️</span>
          <input type="password" id="senha" placeholder="•••••••" />
        </div>
      </div>

      <div class="campo">
        <label>Email</label>
        <input type="email" id="email" placeholder="exemplo@email.com" readonly aria-describedby="emailAjuda" />
        <small id="emailAjuda">Para alterar o e-mail, solicite ajuda pelo contato do site.</small>
      </div>

      <div class="campo">
        <label for="confirmarSenha">Confirme a nova senha</label>
        <div class="input-icon">
          <span>🔒</span>
          <input type="password" id="confirmarSenha" placeholder="•••••••" />
        </div>
      </div>

      <div class="campo">
        <label>Número</label>
        <input type="tel" id="telefone" placeholder="(00) 00000-0000" />
      </div>
    </div>

    <div class="acoes">
      <button class="btn-voltar" onclick="window.history.back()">←</button>
      <button class="btn-editar" onclick="salvarDados()">Editar dados</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer>© 2025 Aflorar. Todos os direitos reservados.</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/js/auth-session.js"></script>
  <script src="../shared/js/config.js"></script>
</body>

</html>
