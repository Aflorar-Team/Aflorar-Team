<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Psicólogo - Aflorar</title>
  <link rel="stylesheet" href="../shared/css/login.css">
  <link rel="stylesheet" href="../shared/css/global.css">
</head>

<body>

  <div class="background" aria-hidden="true">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>

  <header class="topbar">
    <div class="logo-wrap">
      <h1 class="logo">Aflorar</h1>
    </div>
  </header>

  <main class="auth-page">
    <div class="login-card">
      <h2>Crie sua conta</h2>

      <form id="formCadastroPsicologo">
        <label for="nome">Nome completo</label>
        <div class="input-group">
          <input type="text" id="nome" placeholder="Seu nome completo" autocomplete="name" required>
        </div>

        <label>CPF</label>
        <div class="input-group">
          <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric"
            autocomplete="off">
        </div>

        <label>CRP</label>
        <div class="input-group">
          <input type="text" id="crp" placeholder="Ex: 06/123456" maxlength="10" inputmode="numeric" autocomplete="off">
        </div>

        <label>E-mail</label>
        <div class="input-group">
          <input type="email" id="email" placeholder="exemplo@email.com">
        </div>

        <label>Número de telefone</label>
        <div class="input-group">
          <input type="tel" id="telefone" placeholder="(00) 00000-0000" maxlength="15" inputmode="numeric"
            autocomplete="off">
        </div>

        <label>Senha</label>
        <div class="input-group">
          <input type="password" id="password" placeholder="Crie uma senha ou informe a atual" minlength="6"
            maxlength="20" autocomplete="new-password">
          <button type="button" id="togglePassword"></button>
        </div>
        <small>Para vincular este perfil a uma conta existente, use o mesmo e-mail e a senha já cadastrada.</small>

        <p id="mensagemErro" style="color:red; display:none;"></p>
        <p id="mensagemSucesso" style="color:green; display:none;"></p>

        <button type="submit" class="btn-primary">Registrar</button>

        <div class="divider">ou</div>

        <button type="button" class="btn-google" data-google-auth="psicologo">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="">
          Cadastrar com o Google
        </button>

        <p class="register">
          Já tem uma conta? <a href="./login-psicologo.html">Faça login</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="page-footer">
    © 2025 Aflorar. Todos os direitos reservados.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/js/auth-session.js"></script>
  <script src="./js/cadastro-psicologo.js"></script>
</body>

</html>
