<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda - Aflorar</title>
  <link rel="stylesheet" href="./css/agenda-psicologo.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">✿ Aflorar</div>
    <nav class="menu">
      <a href="./dashboard-psicologo.html">
        <span class="icon">🏠</span> Início
      </a>
      <a href="./chat-psicologo.html">
        <span class="icon">💬</span> Mensagens
      </a>
      <a href="./agenda-psicologo.html" class="active">
        <span class="icon">📅</span> Agenda
      </a>
      <a href="./anotacoes-compartilhadas.html">
        <span class="icon">🌿</span> Compartilhadas
      </a>
    </nav>
    <div></div>
  </header>

  <main>
    <div class="agenda-layout">
      <section class="calendario" aria-label="Calendário da agenda">
        <div class="cal-header">
          <div class="nav-mes">
            <button id="btnAnterior" type="button" aria-label="Mês anterior">&#8249;</button>
            <span id="mesAno"></span>
            <button id="btnProximo" type="button" aria-label="Próximo mês">&#8250;</button>
          </div>
        </div>

        <div class="grid-semana" aria-hidden="true">
          <span>DOM</span>
          <span>SEG</span>
          <span>TER</span>
          <span>QUA</span>
          <span>QUI</span>
          <span>SEX</span>
          <span>SAB</span>
        </div>

        <div class="grid-dias" id="gridDias"></div>
        <div class="legenda-agenda" aria-label="Legenda dos marcadores">
          <span><i class="marcador-compromisso"></i> Compromisso</span>
          <span><i class="marcador-aviso"></i> Aviso</span>
          <span><i class="marcador-consulta"></i> Consulta</span>
        </div>
      </section>

      <section class="painel-dia" aria-labelledby="tituloPainel">
        <p class="sobrelinha">SUA ROTINA</p>
        <h1 id="tituloPainel">Agenda do dia</h1>
        <p id="dataSelecionada" class="data-selecionada"></p>

        <div class="acoes-agenda">
          <button id="btnNovoCompromisso" class="botao botao-compromisso" type="button">
            <span aria-hidden="true">+</span> Compromisso
          </button>
          <button id="btnNovoAviso" class="botao botao-aviso" type="button">
            <span aria-hidden="true">+</span> Aviso
          </button>
          <button id="btnNovaConsulta" class="botao botao-consulta" type="button">
            <span aria-hidden="true">+</span> Consulta
          </button>
        </div>

        <p id="estadoVazio" class="estado-vazio" hidden>Nenhum item nesta data.</p>
        <ul id="listaEventos" class="lista-eventos" aria-live="polite"></ul>
      </section>
    </div>
  </main>

  <dialog id="dialogEvento" class="dialog-evento" aria-labelledby="tituloDialogo">
    <form id="formEvento">
      <div class="dialog-cabecalho">
        <div>
          <p id="tipoEventoDialogo" class="sobrelinha"></p>
          <h2 id="tituloDialogo"></h2>
        </div>
        <button id="btnFecharDialogo" class="botao-fechar" type="button" aria-label="Fechar">&times;</button>
      </div>

      <div id="destinoEventoContainer">
        <label for="destinoEvento">Para</label>
        <select id="destinoEvento" name="destino">
          <option value="geral">Geral</option>
          <option value="paciente">Paciente</option>
        </select>
      </div>

      <div id="selecaoPacienteEvento" hidden>
        <label for="pacienteEvento">Qual paciente?</label>
        <select id="pacienteEvento" name="paciente_id" disabled>
          <option value="">Selecione um paciente</option>
        </select>
        <p id="avisoSemPacientes" class="ajuda-campo" hidden>
          Nenhum paciente vinculado foi encontrado.
        </p>
      </div>

      <label for="tituloEvento">Título</label>
      <input id="tituloEvento" name="titulo" type="text" maxlength="90" required
        placeholder="Ex.: Reunião de supervisão">

      <div class="campos-linha">
        <div>
          <label for="dataEvento">Data</label>
          <input id="dataEvento" name="data" type="date" required>
        </div>
        <div>
          <label for="horaEvento">Horário</label>
          <input id="horaEvento" name="hora" type="time" required>
        </div>
      </div>

      <label for="detalhesEvento">Observações <span>(opcional)</span></label>
      <textarea id="detalhesEvento" name="detalhes" rows="3" maxlength="300"
        placeholder="Anotações para você"></textarea>

      <div class="acoes-dialogo">
        <button id="btnCancelarDialogo" class="botao-cancelar" type="button">Cancelar</button>
        <button class="botao botao-salvar" type="submit">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialogMensagem" class="dialog-evento dialog-mensagem" aria-labelledby="tituloDialogoMensagem">
    <h2 id="tituloDialogoMensagem">Aviso</h2>
    <p id="textoDialogoMensagem" role="alert"></p>
    <div class="acoes-dialogo">
      <button id="btnFecharMensagem" class="botao botao-salvar" type="button">Entendi</button>
    </div>
  </dialog>

  <footer>© 2025 Aflorar. Todos os direitos reservados.</footer>

  <script src="./js/agenda-psicologo.js"></script>
</body>

</html>
