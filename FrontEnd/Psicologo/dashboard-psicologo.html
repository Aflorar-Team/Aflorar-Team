<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Aflorar</title>
  <script src="../shared/js/theme.js"></script>
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="../shared/css/theme.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">✿ Aflorar</div>
    <nav class="menu">
      <a href="./dashboard-psicologo.html" class="active">
        <span class="icon">🏠</span> Início
      </a>
      <a href="./chat-psicologo.html">
        <span class="icon">💬</span> Mensagens
      </a>
      <a href="./agenda-psicologo.html">
        <span class="icon">📅</span> Agenda
      </a>
      <a href="./anotacoes-compartilhadas.html">
        <span class="icon">🌿</span> Compartilhadas
      </a>
    </nav>
    <div>
      <a href="./configuracoes.html" aria-label="Ir para configurações">
        <img class="foto-psicologo" src="https://randomuser.me/api/portraits/women/45.jpg"
          alt="Foto de perfil de Amanda B.">
      </a>
    </div>
  </header>

  <main>
    <div class="left">
      <div class="boas-vindas">
        <h2 id="boasVindas">Bem-Vindo(a)!</h2>
        <p>Seu esforço não passa despercebido!</p>
      </div>

      <div class="acoes">
        <button type="button" class="btn-acao btn-demanda" data-popup="demanda">Demanda de hoje</button>
        <button type="button" class="btn-acao btn-mensagens" data-popup="mensagens">Mensagens</button>
        <button type="button" class="btn-acao btn-pacientes" data-popup="pacientes">Adicionar Pacientes</button>
      </div>
    </div>

    <div class="right">
      <h3>Pacientes</h3>
      <div class="lista-pacientes" id="listaPacientes" aria-live="polite">
        <p class="estado-vazio-pacientes">Carregando vínculos...</p>
      </div>
    </div>
  </main>

  <div class="modal" id="popupModal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="popupTitulo">
      <div class="modal-header">
        <h4 id="popupTitulo">Detalhes</h4>
        <button type="button" class="modal-close" aria-label="Fechar popup">×</button>
      </div>
      <div id="popupConteudo"></div>
    </div>
  </div>

  <footer>© 2025 Aflorar. Todos os direitos reservados.</footer>

  <script src="./js/dashboard-psicologo.js"></script>
</body>

</html>
