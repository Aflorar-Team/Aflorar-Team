<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flora - Chat</title>
  <link rel="stylesheet" href="../shared/css/chat.css" />
  <link rel="stylesheet" href="./css/dashboard.css" />
</head>

<body>
  <header class="navbar">
    <div class="logo">✿ Aflorar</div>
    <nav class="menu">
      <a href="./dashboard-psicologo.html" class="active">
        <span class="icon">🏠</span> Início
      </a>
      <a href="./agenda-psicologo.html">
        <span class="icon">📅</span> Agenda
      </a>
    </nav>
    <div></div>
  </header>

  <main class="chat-container">
    <h2>Converse com seu paciente</h2>

    <!-- Área de mensagens -->
    <div class="chat-box" id="chatBox">
      <div class="message bot">
        <span class="avatar"> 👤</span>
        <p>
          Olá! Sou o seu paciente e preciso de auxílio nesse momento...
        </p>
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Digite sua mensagem..." />
      <button id="sendBtn">➤</button>
    </div>
  </main>

  <footer>© 2025 Aflorar. Todos os direitos reservados.</footer>

</body>

</html>
