<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anotações - Aflorar</title>
  <link rel="stylesheet" href="./css/anotacoes.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">✿ Aflorar</div>
    <nav class="menu">
      <a href="./dashboard-psicologo.html">
        <span class="icon">🏠</span> Início
      </a>
      <a href="./chat-psicologo.html">
        <span class="icon">💬</span> Mensagens
      </a>
      <a href="./agenda-psicologo.html">
        <span class="icon">📅</span> Agenda
      </a>
      <a href="./anotacoes-compartilhadas.html">
        <span class="icon">🌿</span> Compartilhadas
      </a>
    </nav>
    <div style="width:40px"></div>
  </header>

  <main>
    <!-- FERRAMENTAS -->
    <div class="ferramentas">
      <div class="boas-vindas">
        <h2>Anotações clínicas</h2>
        <p>Registros separados por paciente e data.</p>
      </div>

      <div class="grupo-ferramenta">
        <label class="campo-nota" for="pacienteNota">Paciente</label>
        <select id="pacienteNota" class="seletor-nota"></select>
        <label class="campo-nota" for="dataNota">Data do registro</label>
        <input id="dataNota" class="seletor-nota" type="date">
        <p id="statusNota" role="status" class="status-nota"></p>
        <button class="btn-exportar" type="button" onclick="exportarPDF()">Exportar PDF</button>
      </div>
    </div>

    <!-- BLOCO DE NOTAS -->
    <div class="bloco-notas">
      <div class="bloco-header">
        <h2 id="tituloNota">Anotação diária</h2>
        <button class="btn-salvar-icon" id="salvarNota" type="button" title="Salvar anotação"
          aria-label="Salvar anotação">Salvar</button>
      </div>

      <textarea class="editor" id="editor" maxlength="10000" placeholder="Registre a anotação deste dia..."
        disabled></textarea>

      <div class="toast-salvo" id="toastSalvo" role="status"></div>
    </div>
  </main>

  <footer>© 2025 Aflorar. Todos os direitos reservados.</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="./js/anotacoes-psicologo.js"></script>
</body>

</html>
