<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Aflorar</title>
  <link rel="stylesheet" href="./Css/global.css">
  <link rel="stylesheet" href="./Css/dashboard.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">✿ Aflorar</div>
    <nav class="menu">
      <a href="#" class="active">
        <span class="icon">🏠</span> Início
      </a>
      <a href="#">
        <span class="icon">📅</span> Agenda
      </a>
    </nav>
    <div></div>
  </header>

  <main>
    <!-- COLUNA ESQUERDA -->
    <div class="left">
      <div class="boas-vindas">
        <h2>Bem-Vindo(a)!</h2>
        <p>Seu esforço não passa despercebido!</p>
      </div>

      <div class="acoes">
        <button class="btn-acao btn-demanda" onclick="window.location.href='#'">
          Demanda de hoje
        </button>
        <button class="btn-acao btn-mensagens" onclick="window.location.href='#'">
          Mensagens
        </button>
        <button class="btn-acao btn-pacientes" onclick="window.location.href='#'">
          Adicionar Pacientes
        </button>
      </div>
    </div>

    <!-- COLUNA DIREITA -->
    <div class="right">
      <h3>Pacientes</h3>
      <div class="lista-pacientes" id="listaPacientes">

        <div class="card-paciente">
          <div class="topo">
            <span class="tag-nome" style="background:#E8717A">Amanda B.</span>
            <span class="tag-horario">Ter. 15:30</span>
          </div>
          <p class="descricao">Descrição da paciente...</p>
          <div class="acoes-paciente">
            <button title="Progresso">📈</button>
            <button title="Chat">💬</button>
            <button title="Alertas">🔔</button>
            <button title="Notas">📋</button>
          </div>
        </div>

        <div class="card-paciente">
          <div class="topo">
            <span class="tag-nome" style="background:#F4A261">Luan K.</span>
            <span class="tag-horario">Ter. 10:30</span>
          </div>
          <p class="descricao">Descrição da paciente...</p>
          <div class="acoes-paciente">
            <button title="Progresso">📈</button>
            <button title="Chat">💬</button>
            <button title="Alertas">🔔</button>
            <button title="Notas">📋</button>
          </div>
        </div>

        <div class="card-paciente">
          <div class="topo">
            <span class="tag-nome" style="background:#E8717A">João G.</span>
            <span class="tag-horario">Qui. 12:00</span>
          </div>
          <p class="descricao">Descrição da paciente...</p>
          <div class="acoes-paciente">
            <button title="Progresso">📈</button>
            <button title="Chat">💬</button>
            <button title="Alertas">🔔</button>
            <button title="Notas">📋</button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer>© 2025 Aflorar. Todos os direitos reservados.</footer>

  <script src="./Js/dashboard.js"></script>
</body>
</html>
