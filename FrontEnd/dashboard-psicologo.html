<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Dashboard - Aflorar</title>
  <link rel="stylesheet" href="./Css/global.css">
  <link rel="stylesheet" href="./Css/dashboard.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">✿ Aflorar</div>
    <nav class="menu">
      <a href="./dashboard-psicologo.html" class="active">
        <span class="icon">🏠</span> Início
      </a>
      <a href="./agenda-psicologo.html">
        <span class="icon">📅</span> Agenda
      </a>
    </nav>
    <div></div>
  </header>

  <main>
    <div class="left">
      <div class="boas-vindas">
        <h2 id="boasVindas">Bem-Vindo(a)!</h2>
        <p>Seu esforço não passa despercebido!</p>
      </div>

      <div class="acoes">
        <button class="btn-acao btn-demanda">Demanda de hoje</button>
        <button class="btn-acao btn-mensagens">Mensagens</button>
        <button class="btn-acao btn-pacientes">Adicionar Pacientes</button>
      </div>
    </div>

    <div class="right">
      <h3>Pacientes</h3>
      <div class="lista-pacientes">

        <div class="card-paciente">
          <div class="topo">
            <div class="info-paciente">
              <span class="tag-nome" style="background:#E8717A">Amanda B.</span>
              <span class="tag-horario">Ter. 15:30</span>
            </div>
            <img class="foto-paciente" src="https://randomuser.me/api/portraits/women/44.jpg"
              alt="Foto de perfil de Amanda B.">
          </div>
          <p class="descricao">Descrição da paciente...</p>
          <div class="acoes-paciente">
            <button title="Editar" onclick="window.location.href='./graficos-pacientes.html'">📊</button>
            <button title="Chat" onclick="window.location.href='./chat-psicologo.html'">💬</button>
            <button title="Alertas">🔔</button>
            <button title="Notas" onclick="window.location.href='./anotacoes-psicologo.html'">📋</button>
          </div>
        </div>

        <div class="card-paciente">
          <div class="topo">
            <div class="info-paciente">
              <span class="tag-nome" style="background:#F4A261">Luan K.</span>
              <span class="tag-horario">Ter. 10:30</span>
            </div>
            <img class="foto-paciente" src="https://randomuser.me/api/portraits/men/32.jpg"
              alt="Foto de perfil de Luan K.">
          </div>
          <p class="descricao">Descrição do paciente...</p>
          <div class="acoes-paciente">
            <button title="Editar" onclick="window.location.href='./graficos-pacientes.html'">📊</button>
            <button title="Chat" onclick="window.location.href='./chat-psicologo.html'">💬</button>
            <button title="Alertas">🔔</button>
            <button title="Notas" onclick="window.location.href='./anotacoes-psicologo.html'">📋</button>
          </div>
        </div>

        <div class="card-paciente">
          <div class="topo">
            <div class="info-paciente">
              <span class="tag-nome" style="background:#E8717A">João G.</span>
              <span class="tag-horario">Qui. 12:00</span>
            </div>
            <img class="foto-paciente" src="https://randomuser.me/api/portraits/men/75.jpg"
              alt="Foto de perfil de João G.">
          </div>
          <p class="descricao">Descrição do paciente...</p>
          <div class="acoes-paciente">
            <button title="Editar" onclick="window.location.href='./graficos-pacientes.html'">📊</button>
            <button title="Chat" onclick="window.location.href='./chat-psicologo.html'">💬</button>
            <button title="Alertas">🔔</button>
            <button title="Notas" onclick="window.location.href='./anotacoes-psicologo.html'">📋</button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer>© 2025 Aflorar. Todos os direitos reservados.</footer>

  <script src="./Js/dashboard-psicologo.js"></script>
</body>

</html>
