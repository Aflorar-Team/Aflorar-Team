<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro Psicólogo - Aflorar</title>
  <link rel="stylesheet" href="./Css/login.css">
  <link rel="stylesheet" href="./Css/global.css">
</head>
<body>

  <div class="background">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>

  <header>
    <h1 class="logo">Aflorar</h1>
  </header>

  <main>
    <div class="login-card">
      <h2>Crie sua conta</h2>

      <form id="formCadastroPsicologo">
        <label>CPF</label>
        <div class="input-group">
          <input type="text" id="cpf" placeholder="000.000.000-00">
        </div>

        <label>CRP</label>
        <div class="input-group">
          <input type="text" id="crp" placeholder="Ex: 06/123456">
        </div>

        <label>E-mail</label>
        <div class="input-group">
          <input type="email" id="email" placeholder="exemplo@email.com">
        </div>

        <label>Número de telefone</label>
        <div class="input-group">
          <input type="tel" id="telefone" placeholder="(00) 00000-0000">
        </div>

        <label>Senha</label>
        <div class="input-group">
          <input type="password" id="password" placeholder="Crie uma senha">
          <button type="button" id="togglePassword"></button>
        </div>

        <p id="mensagemErro" style="color:red; display:none;"></p>
        <p id="mensagemSucesso" style="color:green; display:none;"></p>

        <button type="submit" class="btn-primary">Registrar</button>

        <p class="register">
          Já tem uma conta? <a href="./login-psicologo.html">Faça login</a>
        </p>
      </form>
    </div>
  </main>

  <footer>
    © 2025 Aflorar. Todos os direitos reservados.
  </footer>

  <script src="./Js/cadastro-psicologo.js"></script>
</body>
</html>
